<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesop's Fables</title>
    <link rel="preload" href="fonts/cinzel-v26-latin-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cinzel-v26-latin-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cormorant-garamond-v-21-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cormorant-garamond-v-21-latin-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/reset.css">
    <link rel="stylesheet" href="assets/css.css">
</head>
<body>
    <h1>æsop's Fables</h1>

    <div class="fable__menu-container">
        <button id="fableMenuToggle" class="fable__menu-toggle" type="button">Menu</button>
        <nav id="fableMenu" class="fable__menu" aria-hidden="true"></nav>
    </div>

    <div class="fable__card-container">
        <div class="fable__card">
            <article id="fableCard" class="fable__card-inner">
                <section class="fable__card-front">
                    <h2 class="js-fable-title"></h2>
                    <figure>
                        <img class="js-fable-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Aesops_Fables-Rackham-011.jpg/960px-Aesops_Fables-Rackham-011.jpg" height="960" width="1351" alt="æsop's Fables book cover from 1912" />
                        <figcaption class="js-fable-caption"></figcaption>
                    </figure>
                    <div class="fable__card-content js-fable">
                        <p>HERE, we have a collection of æsop's Fables presented as cards. If you were to click on a card, you would see my interpretation of the Fable - take it or leave it!</p>
                    </div>
                </section>
                <section class="fable__card-back js-fable-comment">
                    <p>BACK</p>
                </section>
                <button class="fable__flip-card-button" type="button" aria-label="If a screenreader, then ignore">
                    <span class="sr-only">
                        Flip the card over.
                    </span>
                </button>
            </article>
        </div>
    </div>
    <div class="fable__controls">
        <button id="prevFable" class="js-fable-prev fable__controls-button fable__controls-button--prev" type="button">Previous Fable</button>
        <button id="nextFable" class="js-fable-next fable__controls-button fable__controls-button--next" type="button">Next Fable</button>
    </div>
    <footer class="fable__footer">
        <p>æsop's Fables are scraped from <a href="https://en.wikisource.org/wiki/%C3%86sop%27s_Fables_(V._S._Vernon-Jones)">Wikisource</a> on 19.04.2026</p>
    </footer>
    <script src="assets/js.js"></script>
</body>
</html>
