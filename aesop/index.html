<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesop's Fables</title>
    <link rel="preload" href="fonts/cinzel-v26-latin-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cinzel-v26-latin-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cormorant-garamond-v-21-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/cormorant-garamond-v-21-latin-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/reset.css">
    <link rel="stylesheet" href="assets/css.css">
</head>
<body>
    <h1>Aesop's Fables</h1>

    <div class="fable__card-container">
        <div class="fable__card">
            <article id="fableCard" class="fable__card-inner">
                <section class="fable__card-front">
                    <h2 class="js-fable-title">Fable Name</h2>
                    <figure>
                        <img class="js-fable-image" src="https://loremflickr.com/320/240?random=1" height="240" width="320" alt="" />
                        <figcaption class="js-fable-caption">A random image from loremflickr</figcaption>
                    </figure>
                    <div class="fable__card-content js-fable">
                        FABLE
                    </div>
                </section>
                <section class="fable__card-back js-fable-comment">
                    <p>BACK</p>
                </section>
                <button class="fable__flip-card" type="button" aria-label="If a screenreader, then ignore">
                    <span class="sr-only">
                        Flip the card over.
                    </span>
                </button>
            </article>
        </div>
    </div>
    <div class="fable__controls">
        <button id="prevFable" class="js-fable-prev">Previous Fable</button>
        <button id="nextFable" class="js-fable-next">Next Fable</button>
    </div>
    <script src="assets/js.js"></script>
</body>
</html>
