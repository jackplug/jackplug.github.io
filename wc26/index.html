<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 Game Monitor (Player-Based)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>World Cup 2026 Game Monitor (Player-Based)</h1>
  <p>Track your teams and players with custom scoring rules.</p>

  <div>
    <h2>Your Selected Teams and Players</h2>
    <ul id="teamList">
      <!-- Teams and players will be listed here -->
    </ul>
    <button onclick="editTeams()">Edit Teams & Players</button>
  </div>

  <div id="editTeamsPanel" style="display: none;">
    <h3>Edit Teams and Players</h3>
    <div id="teamInputs"></div>
    <button onclick="saveTeams()">Save Teams & Players</button>
    <button onclick="cancelEdit()">Cancel</button>
  </div>

  <h2>League Table</h2>
  <div id="status">Loading match data...</div>
  <table id="leagueTable">
    <thead>
      <tr>
        <th>Team (Player)</th>
        <th>Points</th>
        <th>Results</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Teams and results will be added here by JavaScript -->
    </tbody>
  </table>

  <h2>Best Player in Your Group</h2>
  <p id="bestPlayer"></p>

  <button onclick="fetchAndUpdateResults()">Fetch Latest Results</button>
  <button onclick="clearLocalData()">Clear Local Data</button>

  <script>
    // Your 7 teams and their players (default)
    let teams = [
      { name: "Spain", player: "Tom" },
      { name: "Brazil", player: "Philip" },
      { name: "France", player: "Bill" },
      { name: "Germany", player: "Šárka" },
      { name: "Austria", player: "Stuart" },
      { name: "Japan", player: "David" },
      { name: "Iran", player: "Granny" }
    ];

    // Define defenders for each team
    const teamDefenders = {
      "Spain": ["Aymeric Laporte", "Rodri", "Pau Torres", "Jesús Navas"],
      "Brazil": ["Danilo", "Marquinhos", "Éder Militão", "Alex Sandro"],
      "France": ["Jules Koundé", "Ibrahima Konaté", "William Saliba", "Benjamin Pavard"],
      "Germany": ["Antonio Rüdiger", "Jonathan Tah", "Matthias Ginter", "Robin Knoche"],
      "Austria": ["Stefan Lainer", "Maximilian Wöber", "Philipp Mwene", "Gernot Trauner"],
      "Japan": ["Maya Yoshida", "Shogo Taniguchi", "Takehiro Tomiyasu", "Hiroki Sakai"],
      "Iran": ["Saeid Ezatolahi", "Milad Mohammadi", "Ramin Rezaeian", "Shoja' Khalilzadeh"]
    };

    // Initialize team data
    let teamData = teams.map(team => ({
      name: team.name,
      player: team.player,
      played: 0,
      wins: 0,
      draws: 0,
      losses: 0,
      goalsFor: 0,
      goalsAgainst: 0,
      points: 0,
      results: []
    }));

    // Load teams and players from localStorage if available
    function loadTeamsFromLocalStorage() {
      const savedTeams = localStorage.getItem('wc2026Teams');
      if (savedTeams) {
        teams = JSON.parse(savedTeams);
        teamData = teams.map(team => ({
          name: team.name,
          player: team.player,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0,
          results: []
        }));
      }
    }

    // Save teams and players to localStorage
    function saveTeamsToLocalStorage() {
      localStorage.setItem('wc2026Teams', JSON.stringify(teams));
    }

    // Display the list of teams and players
    function displayTeamList() {
      const teamList = document.getElementById('teamList');
      teamList.innerHTML = '';
      teams.forEach(team => {
        const li = document.createElement('li');
        li.textContent = `${team.name} (${team.player})`;
        teamList.appendChild(li);
      });
    }

    // Display the edit teams and players panel
    function editTeams() {
      const panel = document.getElementById('editTeamsPanel');
      const teamInputs = document.getElementById('teamInputs');
      teamInputs.innerHTML = '';

      teams.forEach((team, index) => {
        const div = document.createElement('div');
        div.innerHTML = `
          <input type="text" id="team${index}" value="${team.name}" placeholder="Team Name" style="margin: 5px;">
          <input type="text" id="player${index}" value="${team.player}" placeholder="Player Name" style="margin: 5px;">
          <button onclick="removeTeam(${index})">Remove</button>
        `;
        teamInputs.appendChild(div);
      });

      // Add an empty input for adding a new team
      const addDiv = document.createElement('div');
      addDiv.innerHTML = `
        <input type="text" id="newTeam" placeholder="New team name">
        <input type="text" id="newPlayer" placeholder="Player name">
        <button onclick="addTeam()">Add Team</button>
      `;
      teamInputs.appendChild(addDiv);

      panel.style.display = 'block';
    }

    // Add a new team and player
    function addTeam() {
      const newTeamInput = document.getElementById('newTeam');
      const newPlayerInput = document.getElementById('newPlayer');
      const newTeam = newTeamInput.value.trim();
      const newPlayer = newPlayerInput.value.trim();
      if (newTeam && newPlayer) {
        teams.push({ name: newTeam, player: newPlayer });
        newTeamInput.value = '';
        newPlayerInput.value = '';
        displayTeamList();
      }
    }

    // Remove a team and player
    function removeTeam(index) {
      teams.splice(index, 1);
      displayTeamList();
    }

    // Save teams and players and update teamData
    function saveTeams() {
      teams = [];
      for (let i = 0; i < 7; i++) {
        const teamInput = document.getElementById(`team${i}`);
        const playerInput = document.getElementById(`player${i}`);
        if (teamInput && teamInput.value.trim() && playerInput && playerInput.value.trim()) {
          teams.push({
            name: teamInput.value.trim(),
            player: playerInput.value.trim()
          });
        }
      }
      saveTeamsToLocalStorage();
      teamData = teams.map(team => ({
        name: team.name,
        player: team.player,
        played: 0,
        wins: 0,
        draws: 0,
        losses: 0,
        goalsFor: 0,
        goalsAgainst: 0,
        points: 0,
        results: []
      }));
      document.getElementById('editTeamsPanel').style.display = 'none';
      displayTeamList();
      updateTable();
    }

    // Cancel editing teams and players
    function cancelEdit() {
      document.getElementById('editTeamsPanel').style.display = 'none';
    }

    // Fetch match results from API-FOOTBALL via your Render backend
    async function fetchMatchResultsFromAPI() {
      try {
        const response = await fetch('https://jackplug-github-io-wc26backend.onrender.com/api/matches');
        if (!response.ok) {
          throw new Error(`API request failed: ${response.status}`);
        }
        const data = await response.json();
        return data;
      } catch (error) {
        console.error("Error fetching from API:", error);
        return null;
      }
    }

    // Fetch mock match results (fallback)
    function fetchMockMatchResults() {
      const mockMatches = [
        {
          teams: { home: { name: "Spain" }, away: { name: "Brazil" } },
          goals: { home: 2, away: 1 },
          goalsScorers: {
            home: ["Rodri", "Álvaro Morata"],
            away: ["Vini Jr."]
          }
        },
        {
          teams: { home: { name: "France" }, away: { name: "Germany" } },
          goals: { home: 3, away: 3 },
          goalsScorers: {
            home: ["Kylian Mbappé", "Ousmane Dembélé", "Antoine Griezmann"],
            away: ["Florian Wirtz", "Jamal Musiala", "Niclas Füllkrug"]
          }
        },
        {
          teams: { home: { name: "Austria" }, away: { name: "Japan" } },
          goals: { home: 0, away: 2 },
          goalsScorers: {
            home: [],
            away: ["Ritsu Doan", "Takefusa Kubo"]
          }
        },
        {
          teams: { home: { name: "Iran" }, away: { name: "Spain" } },
          goals: { home: 0, away: 1 },
          goalsScorers: {
            home: [],
            away: ["Lamine Yamal"]
          }
        }
      ];
      return mockMatches;
    }

    // Fetch and update results (with fallback)
    async function fetchAndUpdateResults() {
      document.getElementById('status').textContent = "Fetching match data...";

      // Try to fetch from API first
      let matches = await fetchMatchResultsFromAPI();

      // If API fails or returns no data, use mock data
      if (!matches || matches.length === 0) {
        document.getElementById('status').textContent = "Using mock data (API unavailable or rate-limited).";
        matches = fetchMockMatchResults();
      } else {
        document.getElementById('status').textContent = `Fetched ${matches.length} matches from API.`;
      }

      processMatchResults(matches);
      updateTable();
    }

    // Process match results and update team stats
    function processMatchResults(matches) {
      // Reset stats before reprocessing
      teamData = teams.map(team => ({
        name: team.name,
        player: team.player,
        played: 0,
        wins: 0,
        draws: 0,
        losses: 0,
        goalsFor: 0,
        goalsAgainst: 0,
        points: 0,
        results: []
      }));

      // Process each match
      matches.forEach(match => {
        const homeTeam = teamData.find(t => t.name === match.teams.home.name);
        const awayTeam = teamData.find(t => t.name === match.teams.away.name);

        if (!homeTeam || !awayTeam) return; // Skip if team not in your list

        homeTeam.played++;
        awayTeam.played++;

        const homeScore = match.goals.home;
        const awayScore = match.goals.away;

        homeTeam.goalsFor += homeScore;
        homeTeam.goalsAgainst += awayScore;
        awayTeam.goalsFor += awayScore;
        awayTeam.goalsAgainst += homeScore;

        // Extract goal scorers (API-FOOTBALL provides this)
        const homeGoalScorers = match.goalsScorers?.home || [];
        const awayGoalScorers = match.goalsScorers?.away || [];

        // Check for defender goals in home team
        homeGoalScorers.forEach(scorer => {
          if (teamDefenders[homeTeam.name]?.includes(scorer)) {
            homeTeam.points += 3; // Bonus points for defender goal
          }
        });

        // Check for defender goals in away team
        awayGoalScorers.forEach(scorer => {
          if (teamDefenders[awayTeam.name]?.includes(scorer)) {
            awayTeam.points += 3; // Bonus points for defender goal
          }
        });

        // Determine result
        if (homeScore > awayScore) {
          homeTeam.wins++;
          awayTeam.losses++;
          homeTeam.points += 5; // Win points
          homeTeam.results.push("W");
          awayTeam.results.push("L");
        } else if (homeScore < awayScore) {
          awayTeam.wins++;
          homeTeam.losses++;
          awayTeam.points += 5; // Win points
          homeTeam.results.push("L");
          awayTeam.results.push("W");
        } else {
          homeTeam.draws++;
          awayTeam.draws++;
          homeTeam.points += 2; // Draw points
          awayTeam.points += 2; // Draw points
          homeTeam.results.push("D");
          awayTeam.results.push("D");
        }

        // Add goal points (1 point per goal)
        homeTeam.points += homeScore;
        awayTeam.points += awayScore;
      });
    }

    // Update the league table
    function updateTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      teamData.sort((a, b) => b.points - a.points).forEach(team => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${team.name} (${team.player})</td>
          <td>${team.points}</td>
          <td>${team.results.join(', ')}</td>
        `;
        tableBody.appendChild(row);
      });

      // Display the best player
      if (teamData.length > 0) {
        const bestPlayer = teamData.reduce((prev, current) =>
          (prev.points > current.points) ? prev : current
        );
        document.getElementById('bestPlayer').textContent =
          `The best player in your group is: **${bestPlayer.player}** (${bestPlayer.name}) with ${bestPlayer.points} points!`;
      }
    }

    // Clear local data
    function clearLocalData() {
      localStorage.removeItem('wc2026Teams');
      teams = [
        { name: "Spain", player: "Tom" },
        { name: "Brazil", player: "Philip" },
        { name: "France", player: "Bill" },
        { name: "Germany", player: "Šárka" },
        { name: "Austria", player: "Stuart" },
        { name: "Japan", player: "David" },
        { name: "Iran", player: "Granny" }
      ];
      teamData = teams.map(team => ({
        name: team.name,
        player: team.player,
        played: 0,
        wins: 0,
        draws: 0,
        losses: 0,
        goalsFor: 0,
        goalsAgainst: 0,
        points: 0,
        results: []
      }));
      displayTeamList();
      updateTable();
      document.getElementById('status').textContent = "Local data cleared. Using default teams and players.";
    }

    // Initialize the app
    loadTeamsFromLocalStorage();
    displayTeamList();
    fetchAndUpdateResults();
  </script>
</body>
</html>
